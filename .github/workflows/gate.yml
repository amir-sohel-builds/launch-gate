name: Run the gate

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["specs/**", "tools/**"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: amir-sohel-builds/agent-skills
          path: agent-skills
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evals and the launch checker
        run: python3 -I tools/run_gate.py
      - name: Commit results
        run: |
          git config user.name "launch-gate"
          git config user.email "launch-gate@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update gate results"
          git push
